name: Cloud Security Review CI

on:
  pull_request:
    paths:
      - "projects/cloud-security-architecture-review-platform/**"
      - ".github/workflows/cloud-security-review-ci.yml"
  push:
    branches:
      - main
    paths:
      - "projects/cloud-security-architecture-review-platform/**"
      - ".github/workflows/cloud-security-review-ci.yml"

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/cloud-security-architecture-review-platform/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
